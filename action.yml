name: 'Thank You Action'
description: 'Say "Thank You" to new pull requests'
author: 'Aleks Kamenev'

inputs:
  GITHUB_TOKEN:
    description: 'GitHub token'
    required: true
  TENOR_TOKEN:
    description: 'Optional Tenor API key for a thank-you GIF'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.mjs'
